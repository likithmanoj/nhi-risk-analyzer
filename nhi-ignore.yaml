version: "1.0"
exemptions:
  # ============================================================================
  # 1. CORE ADMINISTRATOR & PIPELINE USERS
  # ============================================================================
  users:
    # Break-glass administrator
    - name: "pam-suite-admin"
      reason: "Emergency break-glass administrator identity; exempt from automated boundaries"
      rules: ["*"]

    # IaC Provisioner
    - name: "terraform"
      reason: "Terraform automation deployment user; needs unrestricted resource provisioning"
      rules: ["*"]

    # NHI Automation Runner User
    - name: "nhi-automation-runner-dev"
      reason: "Execution identity for NHI scanner; must avoid self-containment"
      rules: ["*"]

  # ============================================================================
  # 2. AUTOMATION & AWS SERVICE-LINKED ROLES
  # ============================================================================
  roles:
    # Scanner Execution Role
    - name: "nhi-automation-runner-role-dev"
      reason: "Assumed role for inventory collection, S3 export, and remediation dispatcher"
      rules: ["*"]

    # AWS Service-Linked Roles (AWS-managed, boundary attachment unsupported)
    - name: "AWSServiceRoleForAccessAnalyzer"
      reason: "AWS Service-Linked Role"
      rules: ["*"]

    - name: "AWSServiceRoleForResourceExplorer"
      reason: "AWS Service-Linked Role"
      rules: ["*"]

    - name: "AWSServiceRoleForSupport"
      reason: "AWS Service-Linked Role"
      rules: ["*"]

    - name: "AWSServiceRoleForTrustedAdvisor"
      reason: "AWS Service-Linked Role"
      rules: ["*"]

  # ============================================================================
  # 3. IAM GROUPS
  # ============================================================================
  groups:
    - name: "test-group"
      reason: "IAM groups do not support Permissions Boundaries in AWS IAM APIs"
      rules: ["*"]